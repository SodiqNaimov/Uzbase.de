{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
    <!-- Header -->
    <div class="text-center space-y-2">
        <h1 class="text-3xl font-extrabold tracking-tight">{{ t.info }}</h1>
        <p class="text-slate-500 dark:text-slate-400">Essential guides to help you navigate through German administration and life.</p>
    </div>

    <!-- Category Pills -->
    <div class="flex flex-wrap gap-2 justify-center py-2" id="category-pills">
        <button onclick="filterCategory('all')" id="btn-all" class="cat-btn px-4 py-2 rounded-full text-xs font-bold transition duration-200 bg-gradient-brand text-white shadow-md">
            {{ t.all }}
        </button>
        {% for cat in categories %}
        <button onclick="filterCategory('cat-{{ cat.id }}')" id="btn-cat-{{ cat.id }}" class="cat-btn px-4 py-2 rounded-full text-xs font-bold transition duration-200 bg-slate-100 dark:bg-slate-800/60 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700/80">
            {{ cat.name }}
        </button>
        {% endfor %}
    </div>

    <!-- Search Bar -->
    <div class="max-w-md mx-auto relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="search" class="w-4 h-4"></i>
        </div>
        <input type="text" id="wiki-search" oninput="filterWiki()" placeholder="{{ t.search }} (e.g., Steuernummer, Anmeldung)" class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-darkCard border border-slate-200 dark:border-slate-800 rounded-2xl focus:ring-2 focus:ring-brandGreen focus:border-transparent outline-none transition text-sm shadow-sm text-slate-900 dark:text-white">
    </div>

    <!-- Accordion Cards -->
    <div class="space-y-4" id="wiki-cards-container">
        {% for item in info_items %}
        <div data-category-id="cat-{{ item.category_id }}" class="wiki-card bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden transition-all duration-300">
            <!-- Header Trigger -->
            <button onclick="toggleAccordion({{ item.id }})" class="w-full px-6 py-5 flex items-center justify-between text-left hover:bg-slate-50 dark:hover:bg-slate-800/40 transition">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-brandGreen flex items-center justify-center">
                        <i data-lucide="book-open" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">{{ item.category.name }}</span>
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white mt-0.5">{{ item.title }}</h3>
                    </div>
                </div>
                <div class="rounded-full p-1.5 border border-slate-200 dark:border-slate-700 bg-white dark:bg-darkSlate">
                    <i data-lucide="chevron-down" id="arrow-{{ item.id }}" class="w-4 h-4 text-slate-500 transition-transform duration-300"></i>
                </div>
            </button>

            <!-- Expanded Body -->
            <div id="content-{{ item.id }}" class="max-h-0 overflow-hidden transition-all duration-300 ease-in-out bg-slate-50/50 dark:bg-slate-800/20">
                <div class="px-6 py-6 border-t border-slate-100 dark:border-slate-800/80 text-sm text-slate-600 dark:text-slate-300 leading-relaxed space-y-4">
                    <p>{{ item.content }}</p>
                    <div class="flex items-center space-x-2 pt-2 text-xs font-semibold text-brandBlue dark:text-brandGreen">
                        <i data-lucide="shield-check" class="w-4 h-4"></i>
                        <span>Verified Community Wiki Guide</span>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    function toggleAccordion(id) {
        const content = document.getElementById('content-' + id);
        const arrow = document.getElementById('arrow-' + id);

        if (content.style.maxHeight && content.style.maxHeight !== '0px') {
            content.style.maxHeight = '0px';
            arrow.classList.remove('rotate-180');
        } else {
            // Close other opened ones
            document.querySelectorAll('[id^="content-"]').forEach(el => {
                el.style.maxHeight = '0px';
            });
            document.querySelectorAll('[id^="arrow-"]').forEach(el => {
                el.classList.remove('rotate-180');
            });

            content.style.maxHeight = content.scrollHeight + 'px';
            arrow.classList.add('rotate-180');
        }
    }

    let activeCategory = 'all';

    function filterCategory(catId) {
        activeCategory = catId;
        
        // Update active class on buttons
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.className = "cat-btn px-4 py-2 rounded-full text-xs font-bold transition duration-200 bg-slate-100 dark:bg-slate-800/60 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700/80";
        });

        const activeBtn = document.getElementById(catId === 'all' ? 'btn-all' : 'btn-' + catId);
        if (activeBtn) {
            activeBtn.className = "cat-btn px-4 py-2 rounded-full text-xs font-bold transition duration-200 bg-gradient-brand text-white shadow-md";
        }

        applyFilters();
    }

    function filterWiki() {
        applyFilters();
    }

    function applyFilters() {
        const query = document.getElementById('wiki-search').value.toLowerCase().trim();
        
        document.querySelectorAll('.wiki-card').forEach(card => {
            const cardCatId = card.getAttribute('data-category-id');
            const title = card.querySelector('h3').textContent.toLowerCase();
            const content = card.querySelector('.leading-relaxed p').textContent.toLowerCase();
            
            const matchesCategory = (activeCategory === 'all' || cardCatId === activeCategory);
            const matchesSearch = (!query || title.includes(query) || content.includes(query));
            
            if (matchesCategory && matchesSearch) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }
</script>
{% endblock %}
